name: Python CI

on:
  push:
    branches:
      - master
      - alpha5-dev
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Python syntax check
        run: |
          python -m py_compile ttp_checker.py ttp_recorder.py ttp_langLiveRecorder.py dashboard.py tkinter_dashboard.py alpha5_gate.py

      - name: Alpha 5 gate smoke test
        run: |
          python alpha5_gate.py --days 1 --min-records 1 --min-success-rate 0 --max-avg-restarts 999 || true
