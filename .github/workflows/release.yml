name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release package
        run: |
          mkdir -p dist
          zip -r "dist/TPE48_LangLiveRecorder_${GITHUB_REF_NAME}.zip" \
            *.py *.bat config.json readme.txt members.json .gitignore

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TPE48_LangLiveRecorder_${{ github.ref_name }}.zip
